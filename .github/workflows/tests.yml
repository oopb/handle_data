name: Selected precise-event dataset processors
on:
  push:
    branches: [main]
  pull_request:
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile independent dataset modules and tests
        run: python -m compileall -q ego4d.py hd_epic.py feel.py event_common.py tests
      - name: Run source-grounded synthetic tests
        run: python -m unittest discover -s tests -v
