name: Python annotation converters
on:
  push:
    branches: [main]
  pull_request:
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile converter and tests
        run: python -m compileall -q convert_datasets.py tests
      - name: Run all eight synthetic adapter fixtures
        run: python -m unittest discover -s tests -v
